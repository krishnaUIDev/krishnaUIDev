<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="100%" height="auto" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="14px">
    <style>
        .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5px; rx: 14px; }
        .title { font-size: 18px; font-weight: bold; fill: #58a6ff; }
        .key { fill: #79c0ff; font-weight: 600; }
        .val { fill: #a5d6ff; font-weight: bold; }
        .add { fill: #3fb950; font-weight: bold; }
        .del { fill: #f85149; font-weight: bold; }
        .ascii { fill: #8b949e; font-size: 12px; white-space: pre; font-family: Consolas, 'Courier New', monospace; letter-spacing: 0.5px; }
    </style>
    
    <!-- Background Card -->
