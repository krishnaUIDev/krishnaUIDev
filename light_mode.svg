        .add { fill: #1a7f37; font-weight: bold; }
        .del { fill: #cf222e; font-weight: bold; }
        .ascii { fill: #57606a; font-size: 11px; white-space: pre; font-family: Consolas, 'Courier New', monospace; }
    </style>
    
